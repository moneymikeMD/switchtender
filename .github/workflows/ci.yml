name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  no-personal-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moneymikeMD/ai-toolkit/actions/no-personal-paths@v1

  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint decision records
        run: |
          git clone --depth 1 https://github.com/moneymikeMD/ai-toolkit "$RUNNER_TEMP/ai-toolkit"
          "$RUNNER_TEMP/ai-toolkit/scripts/decisions.sh" lint --root "$PWD"
