# switchtender example configuration
#
# Copy to config.toml and edit. config.toml is gitignored and never committed.
#
# Every location the engine uses lives here. The engine itself holds no
# coordinates, which is what lets this run against any commute with the same
# shape rather than only the one it was written for.
#
# The example below is a real, runnable Boston commute, deliberately unrelated
# to any maintainer's actual route. It is not a redacted version of anything,
# so nothing here needs to be treated as sensitive, and a reader can run the
# tool against it immediately to see the shape of a verdict.
#
# The shape this tool assumes: two ways to reach one destination that share a
# common first leg and diverge at a single point. Drive the whole way, or stop
# at a park-and-ride and take transit the rest. Because the first leg is common
# to both, it cancels out, and only the divergent legs decide the answer.

[route]
timezone = "America/New_York"

# Every place below has the same four keys: lat, lon, label, and
# addl_walk_mins, the minutes on foot added to any leg that ends there.
# addl_walk_mins defaults to 0 and may be left out. Nothing else is accepted.

# Where the commute starts. Its walk is the one to the car before leaving,
# counted only when measuring the whole trip with --from origin.
[route.origin]
lat = 42.4604
lon = -71.3489
label = "Concord town center"
addl_walk_mins = 0

# The fork. Past this point the two options are no longer interchangeable,
# so the verdict has to be delivered before it, never at it. No leg ends
# here, so its walk is never used.
[route.decision_point]
lat = 42.4004
lon = -71.2200
label = "Route 2 at I-95"

# Where the driver would leave the car to take transit. Its walk is from
# parking the car to standing on the platform: stairs, fare gates, the garage
# queue at rush hour. Measure it; do not guess.
[route.park_and_ride]
lat = 42.3954
lon = -71.1425
label = "Alewife station garage"
addl_walk_mins = 5

# Where the commute ends: the door you walk through, not where the car stops.
# The transit leg is measured to here, and so is the drive once the walk from
# the parking spot below is added. The transit answer already includes its
# final walk, so this walk is normally 0.
[route.destination]
lat = 42.3550
lon = -71.0656
label = "Boston Common"
addl_walk_mins = 0

# Optional: where the car actually stops when it is not at the destination,
# such as a cheaper garage a few blocks away. Driving is then routed here and
# its walk (car to the destination door) is added, so both options end at the
# same door. Leave the table out to drive to the destination itself.
# [route.parking]
# lat = 42.3522
# lon = -71.0629
# label = "Garage on the far side of the Common"
# addl_walk_mins = 5

[trigger]
# How far ahead of the decision point to deliver the verdict. Far enough to
# act on, close enough that conditions have not changed. Verify this in the
# car at real speed before trusting it.
lead_miles = 4.0

[decision]
# Transit wins ties. A tie means the model cannot tell them apart, and the
# train is the option whose duration does not degrade while you sit in it.
transit_wins_ties = true

# Driving must beat transit by at least this many minutes to be recommended.
# This is a floor, not the whole rule: the required margin scales up with the
# congestion signal, because a drive estimate taken during heavy congestion
# is less trustworthy than the same estimate taken on an empty road.
minimum_drive_margin_minutes = 5

# Assumed departure for the return leg, used only when something about the
# evening is already known, such as a scheduled event or planned track work.
# A morning forecast cannot see an afternoon crash and will not pretend to.
assumed_evening_departure = "17:30"

[transit]
# Rail lines the transit leg rides, matched against the operator's planned
# track-work schedule (currently the wmata.com table; the Boston example has no
# equivalent source, so it names none and the signal stays quiet).
lines = []

[log]
# One wide row per verdict, appended to a Google Sheet and queried through a
# BigQuery external table (scripts/bq-external-table.sh). A failed write is
# reported and swallowed; it never blocks the verdict. Credentials come from
# SHEETS_ACCESS_TOKEN or the GCE metadata server, never from a key file.
enabled = false
sheet_id = "1AbC...example"
sheet_tab = "verdicts"
# Arrivals recorded by the phone at the parking lot and the office door
# (CMB-41), appended to their own tab and joined to a verdict by local date.
arrivals_tab = "arrivals"

[incidents]
# Bounding box for the live incident query, covering the stretch of the route
# that the regional incident feed does not reach. Order is min then max.
# Keep this tight to the route. A box drawn around a home address is a way of
# publishing a home address.
min_lon = -71.1600
min_lat = 42.3300
max_lon = -71.0300
max_lat = 42.4100

# Venues whose events actually affect this route.
#
# This is an allowlist on purpose, not a radius search. Distance to the
# destination is the wrong metric: a large arena whose crowds disperse away
# from the route matters less than a small hall sitting on the road out. A
# radius promotes venues on size and cannot know which direction traffic
# leaves in. Curate this list; a radius query is a fine way to discover
# candidates for it, but a poor way to filter.
#
# weight scales how much a scheduled event moves the confidence figure.
# Start every venue at 1.0 and adjust only once logged history shows an event
# there actually predicted a slower drive.
#
# provider names where the schedule comes from. The default, "ticketmaster",
# needs EVENTS_API_KEY. Major League ballparks need provider = "mlb": MLB
# sells through its own platform, so Ticketmaster lists nothing for them (a
# full week at one park came back empty on 2026-09-16), and the biggest crowd
# near the destination would otherwise be invisible. The mlb provider reads
# the club's schedule from MLB's keyless stats API instead, and needs the
# club's numeric mlb_team_id. It replaces the ticketing source for that venue
# rather than sitting beside it.
#
# ticketmaster_venue_id is optional and worth setting. Without it every run
# spends one request resolving the name to a vendor id that never changes,
# and the vendor allows only two requests a second (CMB-42). Leave it out
# once, read the id the run reports for the venue, then paste it in:
#
#   ticketmaster_venue_id = "<the id the run reports for this venue>"

[[venues]]
name = "TD Garden"
lat = 42.3662
lon = -71.0621
weight = 1.0

[[venues]]
name = "Fenway Park"
lat = 42.3467
lon = -71.0972
weight = 1.0
provider = "mlb"
mlb_team_id = 111
